<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor-like Web IDE (Single File)</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #0b0d12;
      --panel-2: #121622;
      --elev-1: #161a28;
      --border: #1f2433;
      --text: #d1d5e1;
      --text-dim: #98a2b3;
      --accent: #6ea8fe;
      --accent-2: #54d1db;
      --danger: #f97066;
      --warn: #f7b84b;
      --success: #5bd6a0;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Noto Sans', 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 48px 1fr;
      height: 100vh;
      width: 100vw;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
    }
    .topbar .brand {
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-right: 8px;
    }
    .topbar .spacer { flex: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--elev-1);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: all 120ms ease;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn.primary { background: linear-gradient(180deg, #2b5aff, #244bda); border-color: #244bda; }
    .btn.success { background: linear-gradient(180deg, #1e9c72, #158259); border-color: #158259; }
    .btn.warn { background: linear-gradient(180deg, #b8860b, #8b6508); border-color: #8b6508; }
    .btn.ghost { background: transparent; }

    .layout {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 38% 0px; /* editor | preview | chat (collapsed) */
      grid-template-rows: 100%;
      height: 100%;
      transition: grid-template-columns 200ms ease;
    }
    .pane { border-right: 1px solid var(--border); }
    .pane:last-child { border-right: none; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      padding: 8px 8px 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--elev-1);
      color: var(--text-dim);
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      cursor: pointer;
      opacity: 0.8;
    }
    .tab.active {
      color: var(--text);
      background: linear-gradient(180deg, #1a1f2f, #151a27);
      opacity: 1;
    }

    .editor-container { height: calc(100% - 38px); }
    #editor { width: 100%; height: 100%; }

    /* Preview */
    .preview {
      display: grid;
      grid-template-rows: 38px 1fr;
      height: 100%;
      background: #0a0c11;
    }
    .preview .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .preview-frame { width: 100%; height: 100%; border: none; background: white; }

    /* Chat sidebar */
    .chat {
      display: grid;
      grid-template-rows: 38px 1fr 130px;
      height: 100%;
      background: var(--panel-2);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 18px var(--shadow);
      transition: transform 200ms ease;
    }
    .chat .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .chat .messages { padding: 10px; overflow: auto; }
    .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; white-space: pre-wrap; }
    .msg.user { background: #1a2237; border: 1px solid #223052; }
    .msg.ai { background: #16221c; border: 1px solid #244b37; }
    .msg.error { background: #2a1311; border: 1px solid #5a201b; color: #ffd6d3; }

    .chat .composer {
      display: grid;
      grid-template-rows: auto 36px;
      gap: 8px;
      padding: 8px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .chat textarea {
      width: 100%;
      height: 76px;
      resize: vertical;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--elev-1);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }
    .chat .actions { display: flex; gap: 8px; justify-content: space-between; }

    /* Analysis panel (modal) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      width: min(900px, 92vw);
      max-height: 80vh;
      overflow: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px var(--shadow);
    }
    .modal header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .modal main { padding: 12px; }

    .issue {
      border: 1px solid var(--border);
      border-left: 4px solid var(--warn);
      background: #1e1b12;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .issue.ok { border-left-color: var(--success); background: #0f1d17; }
    .issue .meta { color: var(--text-dim); font-size: 12px; }

    /* Settings dialog */
    .settings {
      display: none;
      position: fixed;
      right: 16px;
      top: 56px;
      width: min(520px, 92vw);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 60;
      box-shadow: 0 10px 30px var(--shadow);
    }
    .settings header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .settings main { padding: 12px; }
    .settings .row { display: grid; grid-template-columns: 160px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
    .settings input[type="text"], .settings input[type="password"] {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--elev-1); color: var(--text);
    }
    .settings .hint { color: var(--text-dim); font-size: 12px; }

    /* Responsive */
    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr 42% 0; }
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr 0 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">▶ Cursor-like IDE</div>
      <button id="btn-run" class="btn primary" title="Run (Ctrl/Cmd+Enter)">Run</button>
      <button id="btn-analyze" class="btn warn" title="Analyze code quality (Alt+A)">Analyze</button>
      <button id="btn-prettify" class="btn" title="Format document (Alt+Shift+F)">Format</button>
      <span class="spacer"></span>
      <button id="btn-settings" class="btn" title="Settings">Settings</button>
      <button id="btn-chat-toggle" class="btn success" title="Toggle Chat (Alt+C)">Chat</button>
    </div>

    <div class="layout" id="layout">
      <!-- Editor pane -->
      <div class="pane" id="pane-editor">
        <div class="tabs" id="tabs"></div>
        <div class="editor-container"><div id="editor"></div></div>
      </div>

      <!-- Preview pane -->
      <div class="pane preview">
        <div class="toolbar">
          <span>Live Preview</span>
          <span class="spacer"></span>
          <button id="btn-refresh-preview" class="btn">Refresh</button>
          <button id="btn-open-window" class="btn ghost">Open in new tab</button>
        </div>
        <iframe id="preview-frame" class="preview-frame" title="Live Preview"></iframe>
      </div>

      <!-- Chat sidebar -->
      <div class="chat" id="chat">
        <div class="toolbar">
          <strong>AI Assistant</strong>
          <div>
            <select id="model-select" class="btn">
              <option value="sonar-pro">sonar-pro</option>
            </select>
            <button id="btn-clear-chat" class="btn ghost">Clear</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <div class="composer">
          <textarea id="chat-input" placeholder="Ask about your code, bugs, or improvements..."></textarea>
          <div class="actions">
            <span class="hint" id="chat-hint">Model: sonar-pro • Shift+Enter for newline</span>
            <div style="display:flex; gap:8px;">
              <button id="btn-insert-selection" class="btn">Use Selection</button>
              <button id="btn-send" class="btn success">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Analysis Modal -->
  <div class="modal-backdrop" id="analysis-backdrop">
    <div class="modal">
      <header>
        <strong>sonar-pro Analysis</strong>
        <div>
          <button id="btn-analysis-copy" class="btn">Copy</button>
          <button id="btn-analysis-close" class="btn">Close</button>
        </div>
      </header>
      <main id="analysis-results"></main>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings" id="settings">
    <header>
      <strong>Settings</strong>
      <button id="btn-settings-close" class="btn">Close</button>
    </header>
    <main>
      <div class="row">
        <label for="api-key">Perplexity API Key</label>
        <input id="api-key" type="password" placeholder="pplx-..." autocomplete="off" />
      </div>
      <div class="row">
        <label for="proxy-url">Optional API Proxy</label>
        <input id="proxy-url" type="text" placeholder="https://your-proxy.example.com/chat/completions" />
      </div>
      <div class="hint">Your key is stored locally in your browser (localStorage). Do not hardcode secrets in this HTML file.</div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button id="btn-save-settings" class="btn success">Save</button>
        <button id="btn-test-api" class="btn">Test API</button>
      </div>
    </main>
  </div>

  <!-- Monaco & Esprima CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/esprima@4.0.1/dist/esprima.min.js"></script>

  <script>
    // ---------------------------
    // App State
    // ---------------------------
    const state = {
      files: {
        'index.html': `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8" />\n  <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n  <title>Live App</title>\n  <!-- styles will be injected -->\n</head>\n<body>\n  <div id="app">\n    <h1>Hello from the single-file IDE</h1>\n    <p>Edit <code>index.html</code>, <code>style.css</code>, and <code>app.js</code> and see changes here.</p>\n  </div>\n  <!-- scripts will be injected -->\n</body>\n</html>`,
        'style.css': `:root { --brand: #2b5aff; }\nbody { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Noto Sans', Arial; margin: 0; padding: 20px; }\nh1 { color: var(--brand); }\n#app { padding: 16px; background: #f7f9fc; border-radius: 10px; border: 1px solid #e5e9f2; }`,
        'app.js': `function greet(name) {\n  const message = 'Hello, ' + name + '!';\n  console.log(message)\n}\n\nwindow.addEventListener('DOMContentLoaded', () => {\n  greet('World');\n});`
      },
      models: {},
      activeFile: 'index.html',
      editor: null,
      chatOpen: false,
      decorations: [],
      analysisMarkers: []
    };

    // ---------------------------
    // Monaco Loader Config for CDN workers
    // ---------------------------
    const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs';
    window.MonacoEnvironment = {
      getWorkerUrl: function(moduleId, label) {
        const blob = new Blob([
          `self.MonacoEnvironment={baseUrl:'${MONACO_BASE}/'};\nimportScripts('${MONACO_BASE}/base/worker/workerMain.js');`
        ], { type: 'text/javascript' });
        return URL.createObjectURL(blob);
      }
    };

    window.require.config({ paths: { 'vs': MONACO_BASE } });

    window.require(['vs/editor/editor.main'], () => {
      initEditor();
      initUI();
      renderTabs();
      setActiveFile('index.html');
      buildPreview();
    });

    function initEditor() {
      // Create models per file
      for (const [name, content] of Object.entries(state.files)) {
        const language = name.endsWith('.html') ? 'html' : name.endsWith('.css') ? 'css' : 'javascript';
        state.models[name] = monaco.editor.createModel(content, language, monaco.Uri.parse(`inmemory:///${name}`));
      }

      state.editor = monaco.editor.create(document.getElementById('editor'), {
        model: null,
        theme: 'vs-dark',
        automaticLayout: true,
        minimap: { enabled: true },
        fontSize: 14,
        scrollBeyondLastLine: false,
        tabSize: 2,
        renderWhitespace: 'selection'
      });

      state.editor.onDidChangeModelContent(debounce(() => {
        const current = state.activeFile;
        state.files[current] = state.models[current].getValue();
        if (current.endsWith('.html') || current.endsWith('.css') || current.endsWith('.js')) {
          buildPreview();
        }
      }, 250));

      // Format shortcut
      state.editor.addCommand(monaco.KeyMod.Alt | monaco.KeyMod.Shift | monaco.KeyCode.KeyF, () => {
        formatDocument();
      });
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      for (const name of Object.keys(state.files)) {
        const el = document.createElement('div');
        el.className = 'tab' + (state.activeFile === name ? ' active' : '');
        el.textContent = name;
        el.onclick = () => setActiveFile(name);
        tabs.appendChild(el);
      }
    }

    function setActiveFile(name) {
      state.activeFile = name;
      state.editor.setModel(state.models[name]);
      renderTabs();
    }

    function formatDocument() {
      // Use Monaco's formatting where available
      state.editor.getAction('editor.action.formatDocument').run().catch(() => {
        // fallback: simple pretty for HTML/JS/CSS could be added
      });
    }

    function debounce(fn, ms) {
      let t = null;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    // ---------------------------
    // Live Preview: assemble HTML + CSS + JS into an iframe srcdoc
    // ---------------------------
    function buildPreview() {
      const html = state.models['index.html'].getValue();
      const css = state.models['style.css'].getValue();
      const js = state.models['app.js'].getValue();

      const injected = injectAssets(html, css, js);
      const iframe = document.getElementById('preview-frame');
      iframe.srcdoc = injected;
    }

    function injectAssets(html, css, js) {
      // Ensure <head> and </body> exist
      let out = html;
      if (!/<head[\s>]/i.test(out)) out = out.replace(/<html[^>]*>/i, m => m + '\n<head></head>');
      if (!/<body[\s>]/i.test(out)) out = out.replace(/<head[\s\S]*?<\/head>/i, m => m + '\n<body></body>');

      // Inject CSS before </head>
      out = out.replace(/<\/head>/i, match => `  <style>\n${css}\n  <\/style>\n${match}`);
      // Inject JS before </body>
      out = out.replace(/<\/body>/i, match => `  <script>\n${js}\n  <\/script>\n${match}`);
      return out;
    }

    // ---------------------------
    // Buttons and UI wiring
    // ---------------------------
    function initUI() {
      document.getElementById('btn-run').onclick = () => buildPreview();
      document.getElementById('btn-refresh-preview').onclick = () => buildPreview();
      document.getElementById('btn-open-window').onclick = () => openPreviewTab();
      document.getElementById('btn-analyze').onclick = () => runAnalysis();
      document.getElementById('btn-prettify').onclick = () => formatDocument();
      document.getElementById('btn-chat-toggle').onclick = () => toggleChat();
      document.getElementById('btn-clear-chat').onclick = () => clearChat();
      document.getElementById('btn-send').onclick = () => sendChat();
      document.getElementById('btn-insert-selection').onclick = () => insertSelectionIntoPrompt();

      document.getElementById('btn-analysis-close').onclick = () => setAnalysisOpen(false);
      document.getElementById('btn-analysis-copy').onclick = () => copyAnalysis();

      document.getElementById('btn-settings').onclick = () => setSettingsOpen(true);
      document.getElementById('btn-settings-close').onclick = () => setSettingsOpen(false);
      document.getElementById('btn-save-settings').onclick = () => saveSettings();
      document.getElementById('btn-test-api').onclick = () => testApi();

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); buildPreview(); }
        if (e.altKey && e.key.toLowerCase() === 'a') { e.preventDefault(); runAnalysis(); }
        if (e.altKey && e.key.toLowerCase() === 'c') { e.preventDefault(); toggleChat(); }
      });

      // Layout: start with chat closed
      applyChatLayout();

      // Settings initial load
      const savedKey = localStorage.getItem('pplx_api_key');
      const savedProxy = localStorage.getItem('pplx_proxy_url');
      if (savedKey) document.getElementById('api-key').value = savedKey;
      if (savedProxy) document.getElementById('proxy-url').value = savedProxy;
    }

    function openPreviewTab() {
      const html = state.models['index.html'].getValue();
      const css = state.models['style.css'].getValue();
      const js = state.models['app.js'].getValue();
      const injected = injectAssets(html, css, js);
      const blob = new Blob([injected], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    function toggleChat() {
      state.chatOpen = !state.chatOpen;
      applyChatLayout();
    }

    function applyChatLayout() {
      const layout = document.getElementById('layout');
      layout.style.gridTemplateColumns = state.chatOpen ? '1fr 36% 32%' : '1fr 38% 0';
    }

    function setAnalysisOpen(open) {
      document.getElementById('analysis-backdrop').style.display = open ? 'flex' : 'none';
    }

    function copyAnalysis() {
      const text = document.getElementById('analysis-results').innerText;
      navigator.clipboard.writeText(text).then(() => {
        toast('Analysis copied');
      });
    }

    function setSettingsOpen(open) {
      document.getElementById('settings').style.display = open ? 'block' : 'none';
    }

    function saveSettings() {
      const key = document.getElementById('api-key').value.trim();
      const proxy = document.getElementById('proxy-url').value.trim();
      if (key) localStorage.setItem('pplx_api_key', key); else localStorage.removeItem('pplx_api_key');
      if (proxy) localStorage.setItem('pplx_proxy_url', proxy); else localStorage.removeItem('pplx_proxy_url');
      toast('Settings saved');
      setSettingsOpen(false);
    }

    function testApi() {
      const key = localStorage.getItem('pplx_api_key') || '';
      const model = document.getElementById('model-select').value;
      if (!key) { toast('Set API key first'); return; }
      const endpoint = getApiEndpoint();
      fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify({
          model,
          temperature: 0.1,
          max_tokens: 16,
          messages: [
            { role: 'system', content: 'You are a helpful assistant.' },
            { role: 'user', content: 'Say OK.' }
          ]
        })
      }).then(r => r.json()).then(d => {
        if (d && d.choices && d.choices[0] && d.choices[0].message) {
          toast('API test OK');
        } else {
          toast('API responded unexpectedly');
        }
      }).catch(err => {
        console.warn(err);
        toast('API request failed (CORS or key)');
      });
    }

    function getApiEndpoint() {
      const proxy = localStorage.getItem('pplx_proxy_url');
      return (proxy && proxy.length > 0) ? proxy : 'https://api.perplexity.ai/chat/completions';
    }

    // ---------------------------
    // Chat: Perplexity AI (browser note: may require proxy due to CORS)
    // ---------------------------
    function clearChat() {
      document.getElementById('messages').innerHTML = '';
    }

    function appendMessage(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content) return;
      const key = localStorage.getItem('pplx_api_key') || '';
      if (!key) { appendMessage('Please set your Perplexity API key in Settings.', 'error'); return; }
      const model = document.getElementById('model-select').value;

      appendMessage(content, 'user');
      input.value = '';

      const codeBundle = buildCodeBundleForPrompt();
      const prompt = `You are assisting inside a web IDE. Consider the following project files and answer the user.\n\n${codeBundle}\n\nUser question: ${content}`;

      appendMessage('Thinking…', 'ai');

      const endpoint = getApiEndpoint();
      fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify({
          model,
          temperature: 0.7,
          max_tokens: 512,
          messages: [
            { role: 'system', content: 'You are a senior frontend engineer helping with code and best practices.' },
            { role: 'user', content: prompt }
          ]
        })
      }).then(r => r.json()).then(d => {
        const lastMsg = document.querySelector('#messages .msg.ai:last-child');
        if (d && d.choices && d.choices[0] && d.choices[0].message) {
          lastMsg.textContent = d.choices[0].message.content || '[No content]';
        } else {
          lastMsg.classList.add('error');
          lastMsg.textContent = 'Unexpected response from API.';
        }
      }).catch(err => {
        console.warn(err);
        const lastMsg = document.querySelector('#messages .msg.ai:last-child');
        lastMsg.classList.add('error');
        lastMsg.textContent = 'Failed to fetch from API (possible CORS). Consider configuring an API proxy in Settings.';
      });
    }

    function insertSelectionIntoPrompt() {
      const selection = state.editor.getModel() ? state.editor.getModel().getValueInRange(state.editor.getSelection()) : '';
      const input = document.getElementById('chat-input');
      input.value = selection ? (input.value ? input.value + '\n\n' : '') + selection : input.value;
      input.focus();
    }

    function buildCodeBundleForPrompt() {
      const maxPerFile = 1200; // chars per file budget to limit prompt size
      const parts = [];
      for (const [name, content] of Object.entries(state.files)) {
        const truncated = content.length > maxPerFile ? content.slice(0, maxPerFile) + '\n/* …truncated… */' : content;
        parts.push(`File: ${name}\n\n\n${truncated}`);
      }
      return parts.join('\n\n--------------------\n\n');
    }

    // ---------------------------
    // sonar-pro: Client-side static analysis (basic heuristics)
    // ---------------------------
    function runAnalysis() {
      const results = [];
      const jsCode = state.models['app.js'].getValue();

      // 1) Syntax errors (JS)
      let syntaxOk = true; let syntaxError = null;
      try { new Function(jsCode); } catch (e) { syntaxOk = false; syntaxError = e.message; }
      if (syntaxOk) results.push({
        type: 'ok',
        title: 'No syntax errors detected in app.js',
        detail: ''
      }); else results.push({
        type: 'error',
        title: 'Syntax error detected in app.js',
        detail: String(syntaxError)
      });

      // 2) Unused variables (via Esprima)
      try {
        const ast = esprima.parseScript(jsCode, { range: true, tolerant: true });
        const declared = new Map(); // name -> [{start,end}]
        const used = new Map();

        walk(ast, (node, parent) => {
          if (node.type === 'VariableDeclarator' && node.id && node.id.type === 'Identifier') {
            const n = node.id.name;
            if (!declared.has(n)) declared.set(n, []);
            declared.get(n).push(node.id.range);
          }
          if (node.type === 'FunctionDeclaration' && node.id) {
            const n = node.id.name; if (!declared.has(n)) declared.set(n, []); declared.get(n).push(node.id.range);
          }
          if (node.type === 'Identifier') {
            const n = node.name;
            if (!used.has(n)) used.set(n, 0);
            // Exclude declaration identifiers
            const isDecl = parent && (
              (parent.type === 'VariableDeclarator' && parent.id === node) ||
              (parent.type === 'FunctionDeclaration' && parent.id === node) ||
              (parent.type === 'FunctionExpression' && parent.id === node) ||
              (parent.type === 'ClassDeclaration' && parent.id === node)
            );
            if (!isDecl) used.set(n, used.get(n) + 1);
          }
        });

        const unused = [];
        for (const [name, ranges] of declared.entries()) {
          if ((used.get(name) || 0) === 0) unused.push({ name, ranges });
        }

        if (unused.length) {
          results.push({
            type: 'warn',
            title: 'Unused variables detected',
            detail: unused.map(u => `• ${u.name}`).join('\n')
          });
          // Add Monaco markers
          const model = state.models['app.js'];
          const markers = unused.map(u => {
            const start = model.getPositionAt(u.ranges[0][0]);
            const end = model.getPositionAt(u.ranges[0][1]);
            return {
              severity: monaco.MarkerSeverity.Warning,
              message: `Unused variable: ${u.name}`,
              startLineNumber: start.lineNumber,
              startColumn: start.column,
              endLineNumber: end.lineNumber,
              endColumn: end.column
            };
          });
          monaco.editor.setModelMarkers(model, 'sonar-pro', markers);
          state.analysisMarkers = markers;
        } else {
          results.push({ type: 'ok', title: 'No unused variables found', detail: '' });
          monaco.editor.setModelMarkers(state.models['app.js'], 'sonar-pro', []);
          state.analysisMarkers = [];
        }
      } catch (e) {
        results.push({ type: 'error', title: 'Analysis failed (parser)', detail: String(e.message || e) });
      }

      // 3) Missing semicolons (heuristic): warn lines of code ending typical tokens without ';'
      const semiIssues = [];
      const jsLines = jsCode.split(/\n/);
      for (let i = 0; i < jsLines.length; i++) {
        const line = jsLines[i].trim();
        if (!line || /[\{\}:]$/.test(line)) continue; // ignore blocks/labels
        const endsWithStmt = /[\w\)\]\"\'\`]$/.test(line);
        const hasSemicolon = /;\s*(\/\/.*)?$/.test(line);
        const isControl = /^(if|for|while|switch|try|catch|finally|else|do)\b/.test(line);
        if (endsWithStmt && !hasSemicolon && !isControl) {
          semiIssues.push({ line: i + 1, lineText: jsLines[i] });
        }
      }
      if (semiIssues.length) {
        results.push({ type: 'warn', title: 'Possible missing semicolons', detail: semiIssues.map(s => `Line ${s.line}: ${s.lineText}`).join('\n') });
      } else {
        results.push({ type: 'ok', title: 'No obvious missing semicolons', detail: '' });
      }

      // 4) Simple code smells: long functions, deep nesting, many params
      try {
        const ast = esprima.parseScript(jsCode, { range: true, loc: true });
        const smells = [];
        walk(ast, (node, parent, depth) => {
          if (node.type === 'FunctionDeclaration' || node.type === 'FunctionExpression' || node.type === 'ArrowFunctionExpression') {
            const start = node.loc.start.line; const end = node.loc.end.line;
            const length = end - start + 1;
            if (length > 40) smells.push({ title: `Long function (${length} lines)`, line: start });
            const params = node.params ? node.params.length : 0;
            if (params > 4) smells.push({ title: `Function with many params (${params})`, line: start });
          }
          if (depth > 3 && node.type.endsWith('Statement')) {
            smells.push({ title: `Deep nesting (depth ${depth}) near ${node.type}`, line: node.loc.start.line });
          }
        });
        if (smells.length) results.push({ type: 'warn', title: 'Code smells', detail: smells.map(s => `Line ${s.line}: ${s.title}`).join('\n') });
        else results.push({ type: 'ok', title: 'No simple code smells detected', detail: '' });
      } catch (e) { /* ignore */ }

      // Render results
      const container = document.getElementById('analysis-results');
      container.innerHTML = '';
      for (const r of results) {
        const div = document.createElement('div');
        div.className = 'issue' + (r.type === 'ok' ? ' ok' : '');
        div.innerHTML = `<div><strong>${escapeHtml(r.title)}</strong></div>` + (r.detail ? `<div class="meta">${escapeHtml(r.detail)}</div>` : '');
        container.appendChild(div);
      }
      setAnalysisOpen(true);
    }

    function walk(node, visit, depth = 0, parent = null) {
      visit(node, parent, depth);
      for (const key in node) {
        if (!Object.prototype.hasOwnProperty.call(node, key)) continue;
        const child = node[key];
        if (Array.isArray(child)) {
          for (const c of child) if (c && typeof c.type === 'string') walk(c, visit, depth + 1, node);
        } else if (child && typeof child.type === 'string') {
          walk(child, visit, depth + 1, node);
        }
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------------------------
    // Toast helper
    // ---------------------------
    function toast(text) {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.position = 'fixed';
      div.style.right = '16px';
      div.style.bottom = '16px';
      div.style.padding = '10px 12px';
      div.style.background = '#1a2237';
      div.style.border = '1px solid #223052';
      div.style.borderRadius = '8px';
      div.style.zIndex = '100';
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 2200);
    }
  </script>
</body>
</html>
